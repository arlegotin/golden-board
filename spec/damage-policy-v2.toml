new_negative_scope = "compact-wire; compressed-body-length-distance-flags-EOF; checked-required-and-all-only-content-control; foreign-profile7"
outcome_values_present = false

[decoder]
allowed_inputs = "exact-serialized-observation-and-source-owned-candidate-neutral-code-and-policy-only"
forbidden_inputs = "clean-carrier; candidate-manifest; builder-sections; compiled-content; case-id; expected-result; saved-output"
registry_profile_order = [8, 2, 3, 4, 5, 6, 7]
establishing_profile_versions = [8]
obs_bits_parse = "u32-be-count-and-exact-msb-packed-bits; zero-unused-low-bits"
obs_matrix_parse = "u16-be-side-and-side-squared-bytes-in-0-1-2;2-is-erasure"
obs_units_parse = "u32-be-count-at-most2389; repeated-u32-id-u16-byte-length-and-bytes; IDs-unique-nonzero-u32-not-bounded-by-count-or2389; extra-IDs-diagnostic"
obs_units_order = "input-id-ascending-then-all-registry-procedures-without-short-circuit"
square_order = "transform0..7-then-polarity0..1; xor-only-known-bits"
route_order = "width8..128-by8-with-geometry-domain-then-sector0..3"
route_source = "observed-shell-only; no-source-builder-import-or-generated-route-equality"
route_wire = "route2; exact47-record-skeleton; compact-package1; package-tables-once; endpoint1"
route_examples = "execute-every-observed-primary-additional-and-ten-embedded-group-example; exact-declared-interface; STATUS16; nonzero-status-has-no-data"
route_definitions = "descriptor-and-numeric-structural-validation-is-development-framing-only; production-also-requires-explicit-mathematical-relationship-validation-and-carried-use-ablation"
mapping = "derive109-affine-values-and17-slot-table-from-observed-package; enforce-bootstrap-v2-full-domains"
grouping = "IDs1..5-bootstrap-inventory2; then-checked-inventory-factor-groups; no-header-remapping"
group_acceptance = "enumerate-all-lanes-and-raw-REP; deduplicate-complete-blocks; zero-none; one-accept; two-or-more-conflict"
verified = "matching-all-known-no-correction-valid-lane; raw-REP-alone-is-recovered"
body = "version0-raw; version1-complete-carried-recipe202; atomic-output;16KiB-stored-and-decoded-bounds"
body_execution_square = "checked-inventory-physical-count-equals-observed-geometry-Q; execute202-from-observed-compact-package; native-equivalent-only-if-observed-logical202-transitive-program-and-table-closure-equals-independently-source-owned-neutral-body-VM-closure-and-explicit-native/VM-refinement-KAT-passes; charge-identical-observed-logical-resources; changed-program-uses-observed-generic-VM"
body_execution_units = "OBS_UNITS-has-no-carried-route; checked-inventory-physical-count-at-most2389; source-owned-body-codec-v1-is-a-known-channel-transform-with-exact-declared202-charge-and-explicit-native/VM-refinement-KAT; this-is-not-acquisition-evidence"
body_refinement = "compare-valid-malformed-padding-boundary-and-max-length-results-status-and-output-availability-against-generic202; neutral-body-compiler-only-implements-known-transform-specification-never-regenerates-full-route-lesson-or-carrier; no-SHA-equality-as-knowledge-use-proof; never-claim-native-shortcut-itself-supplies-carried-knowledge"
required = "recover-every-required-body-before-full-content-v0-validation; invalid-required-exposes-neither-stream"
all_only = "invalid-or-missing-all-only-may-expose-valid-required-with-degraded-artifact"
diagnostic = "checked-foreign-or-uninventoried-sections-never-establish-profile8-catalog-or-content"
no_inventory = "retain-only-observed-diagnostics-and-independently-checked-sections; no-invented-catalog-completeness"
route_conflict = "enumerate-distinct-valid-routes; ambiguous-only-if-distinct-complete-checked-downstream-results-survive"

[resource]
counter_type = "u64"
cache_changes_logical_charge = false
section_attempt_limit = 4096
attempt_eligibility = "deduplicated-complete-header-dependency-payload-and-declared-check-width-structure"
attempt_charge_point = "immediately-before-stored-check-comparison"
wrong_check_width_consumes_attempt = false
wrong_stored_order_consumes_attempt = true
lane_charge = "24*recipe30-exact-declared-steps-for-each-present-lane"
repetition_charge = "1728*recipe113-exact-steps+24*recipe30-exact-steps-for-each-factor2-or5-group-with-any-present-lane"
body_charge = "one-full-declared-recipe202-charge-per-invoked-compressed-body-per-logical-route-path; shared-required/all-body-decoded-once-within-that-path; raw-bodies-do-not-invoke202"
route_charge = "every-worked-held-additional-mapping-and-embedded-group-recipe-actually-invoked-before-accept-or-first-stable-reject"
aggregate_charge = "sum-all-logical-invocations-even-when-cached; checked-u64; no-invented-aggregate-per-recipe-cap"
peak_scratch = "maximum-live-declared-recipe-and-adapter-state; include-body-decoder-buffers"
global_exhaustion = "resource-limit-with-no-partial-canonical-result"
program_rows_scope = "exact-static-resource-declarations-from-source-built-packages; not-measured-carrier-or-damage-limits"

[decoder_result]
schema = "golden-board.m2-damage-decoder-result/v2"
