schema = "golden-board.curriculum/v0"

[roadmap_mirror]
kind = "checked_mirror"
owner = "docs/roadmap.md"

[roadmap_mirror.cohort]
selected_learners = 6
screened_slots_min = 6
screened_slots_max = 8
reserve_slots_max = 2

[roadmap_mirror.eligibility]
requires_no_prior_full_game_unaided = true
familiarization_id = "non_chess_response_familiarization"
familiarization_repeatable = true
familiarization_unscored = true
familiarization_covers_every_form_mechanic = true
familiarization_minimum_response_shapes = ["single", "set", "sequence"]
familiarization_minimum_actions = ["select", "reset", "commit"]
familiarization_minimum_commits = ["empty", "nonempty"]
integrated_screen_id = "integrated_legal_sequence_pre"
integrated_screen_required_outcome = "fail"
required_failed_family_ids = ["king_safety"]
required_failed_set_id = "S"
required_failed_set_min = 2
complete_valid_unhinted_pretest_required = true
same_item_retry_allowed = false
invalid_baseline_outcome = "unavailable"

[roadmap_mirror.selection]
baseline_coverage_family_set_ids = ["E", "C"]
baseline_failures_per_family_min = 3
every_family_coverage_unconditional = true
combined_core3_claim_optional = true
combined_core3_claim_learners_with_any_baseline_failure_min = 4
selection_before_artifact_instruction = true

[roadmap_mirror.timing]
instruction_start_max_hours_after_pretest = 24
initial_active_hours_min = 4
initial_active_hours_max = 8
initial_sessions_max = 3
initial_elapsed_days_max = 7
initial_clock_includes = [
  "familiarization",
  "pretest",
  "artifact_instruction_practice",
  "immediate_posttest",
]
delayed_window_min_hours = 36
delayed_window_max_hours = 60
delayed_interval_closed = true
delayed_first_attempt_only = true
early_late_invalid_attempt_retry_allowed = false
feedback_fallback_hours_after_posttest_deadline = 60

[roadmap_mirror.denominator]
freezes_at = "first_artifact_instruction_or_practice"
replacement_after_freeze_allowed = false
replacement_before_freeze_causes = ["administrative_withdrawal", "setup_failure"]
participant_invalid_or_missing_after_freeze = "fixed_denominator_failure"
candidate_or_evaluator_defect = "invalidate_affected_form_or_candidate"

[roadmap_mirror.feedback_embargo]
screened_slot_scope = "every_screened_slot_including_unused_reserves"
result_bearing_acknowledgement = "presentation_identical_neutral"
correctness_before_release_allowed = false
release_clock = "last_selected_normal_or_fallback_window"
early_posttest_correctness_result = "affected_delayed_evidence_invalid"
pretest_or_form_answer_leak_result = "affected_current_and_later_evidence_and_form_invalid"
invalid_early_delayed_attempt_resolves_window = false

[roadmap_mirror.help]
category_ids = [
  "interface_clarification",
  "procedural_reminder",
  "semantic_hint",
  "answer_revelation",
]
outside_semantic_study_or_help_result = "affected_fixed_denominator_failure"
invasive_monitoring_required = false
screened_restriction_until_denominator_freeze = [
  "no_external_chess_study",
  "no_help",
  "no_sharing",
]
unused_reserve_after_selection_restrictions = ["no_sharing", "feedback_embargo"]
selected_through_posttest_restrictions = [
  "artifact_stream_only",
  "no_external_chess_study",
  "no_help",
  "no_sharing",
]
selected_after_posttest_restrictions = ["no_restudy", "no_sharing"]

[[roadmap_mirror.help.category]]
id = "interface_clarification"
allowed = true
recorded = true
result_effect = "none"

[[roadmap_mirror.help.category]]
id = "procedural_reminder"
allowed = true
recorded = true
result_effect = "exclude_affected_item_from_unhinted_success"

[[roadmap_mirror.help.category]]
id = "semantic_hint"
allowed = false
recorded = true
result_effect = "invalidate_affected_result_bearing_run"

[[roadmap_mirror.help.category]]
id = "answer_revelation"
allowed = false
recorded = true
result_effect = "invalidate_affected_result_bearing_run"

[roadmap_mirror.interruption]
checkpoint = "after_committed_item"
after_commit = "resume_next_unpresented_with_log_unchanged"
before_commit = "item_missing_no_retry"
baseline_effect = "form_unavailable"
postfreeze_effect = "item_incorrect"

[roadmap_mirror.privacy_reveal]
commitment_before_first_screened_pretest = true
commitment_intent = "bind_frozen_private_protocol_and_assessment_bundle"
commitment_byte_framing_owner = "later_private_assessment_manifest"
private_until = "all_selected_normal_or_fallback_windows_resolve"
authorized_reveal_required = true
learner_public_forbidden_before_authorized_reveal = [
  "candidate_bound_result_bearing_payload",
  "accepted_response_set",
  "accepted_response_cardinality",
  "usable_generation_seed",
  "display_schedule",
  "answer_map",
]
public_before_reveal_allowed = [
  "commitment_digest",
  "explicit_non_candidate_synthetic_test",
]
public_report_uses_opaque_slot_ids = true
public_report_forbids_name_contact_free_text = true
private_identity_mapping_and_consent = "evaluator_only"

[roadmap_mirror.claim_ceiling]
cohort_scope = "selected_six_person_chess_naive_cohort"
post_use_scope = "declared_rule_and_relation_families"
delay_scope = "approximately_two_day_essential_core_rule_performance"
population_effectiveness = false
causal_efficacy = false
psychometric_equivalence = false
durable_retention = false
p_values_or_inferred_population_percentages = false

[taxonomy]
tier_ids = ["core0", "core1", "core2", "core3", "core4"]
split_ids = ["teaching", "practice", "pretest", "posttest", "delayed"]
response_shape_ids = ["single", "set", "sequence"]
primary_generator_ids = [
  "training",
  "formative",
  "pretest",
  "final_transfer",
  "delayed",
]
orthogonal_generator_ids = ["cue_control"]
exactly_one_primary_generator_per_item = true
