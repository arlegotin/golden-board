held_out_coverage_any_of_splits = ["posttest", "delayed"]
every_core3_stratum_split = "posttest"
delayed_family_set_id = "E"
multi_stratum_item_allowed = true
multi_stratum_credit = "every_referenced_stratum_checker_recomputed_and_passed"
assessment_item_exactly_one_family = true
