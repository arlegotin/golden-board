  "castling.from_check",
  "castling.through_check",
  "castling.into_check",
  "en_passant.self_check",
  "termination_score.post_terminal_rejection",
  "termination_score.score_vs_cause",
]

[authoring_minimums]
applies_to = "every_registered_concept"
grounded_rule_or_relation_per_concept = 1
contrasting_worked_boundary_or_counterexample_per_concept = 1
active_packed_prediction_with_immediate_feedback_per_concept = 1
distinct_held_out_practice_per_concept = 1
passive_trace_per_packed_practice_node = 1
active_and_held_out_practice_must_be_distinct = true
grounding_role_any_of = ["exact_rule", "observable_relation"]
contrasting_role_id = "worked_example"
active_role_id = "practice"
feedback_role_id = "feedback"
passive_role_id = "passive_trace"
heuristic_role_required_concept_ids = [
  "c3.material_heuristic",
  "c3.practical_heuristic_set",
]
requires_concept_ids = [
  "c0.scalar_equality",
  "c0.order_sequence",
  "c0.matrix_position",
  "c0.generic_records_roles",
  "c0.selection_feedback",
  "c3.material_heuristic",
  "c3.practical_heuristic_set",
  "c3.bounded_move_check",
  "c4.record_literacy",
]

