allowed_misses = 1
negative_input_result = "invalid_protocol"
below_domain_result = "no_claim"
inside_domain_operation = "checked_b_minus_one"
above_domain_result = "invalid_protocol"
boundary_inputs = [0, 1, 2, 3, 4, 5, 6, 7]
boundary_results = [
  "no_claim",
  "no_claim",
  "no_claim",
  "2",
  "3",
  "4",
  "5",
  "invalid_protocol",
]

